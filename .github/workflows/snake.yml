name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit
  workflow_dispatch:       # bouton "Run workflow" manuel
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MrVacasse
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=D4A857&color_dots=#0b0d16,#3a2f1f,#6b5430,#a3813f,#D4A857

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
